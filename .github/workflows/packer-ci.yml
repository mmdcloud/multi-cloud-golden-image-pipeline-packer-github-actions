name: "Packer CI - Lint, Validate & Security Scan"

on:
  pull_request:
    branches: [main]
    paths:
      - 'packer/**'
      - 'ansible/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/packer-ci.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'packer/**'
      - 'ansible/**'
      - 'scripts/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: "Validate Packer & IaC Configurations"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup HashiCorp Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.10.3"

      - name: Check Packer Formatting (packer fmt)
        id: fmt
        run: |
          packer fmt -check -diff -recursive packer/

      - name: Initialize Packer Plugins
        run: |
          packer init packer/versions.pkr.hcl

      - name: Validate AWS Packer Configuration
        run: |
          packer validate \
            -var-file="packer/vars/common.pkrvars.hcl" \
            -var-file="packer/vars/aws.pkrvars.hcl" \
            -only="amazon-ebs.builder" \
            packer/

      - name: Validate GCP Packer Configuration
        run: |
          packer validate \
            -var-file="packer/vars/common.pkrvars.hcl" \
            -var-file="packer/vars/gcp.pkrvars.hcl" \
            -only="googlecompute.builder" \
            packer/

      - name: Validate Azure Packer Configuration
        run: |
          packer validate \
            -var-file="packer/vars/common.pkrvars.hcl" \
            -var-file="packer/vars/azure.pkrvars.hcl" \
            -only="azure-arm.builder" \
            packer/

  security-scan:
    name: "Security & Policy Analysis (Checkov & Shellcheck)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Shellcheck on Provisioner Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: 'scripts'
        continue-on-error: false

      - name: Run Checkov Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: all
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: Setup Python for Ansible Lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible & Ansible-Lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Run Ansible Syntax Check
        run: |
          ansible-playbook --syntax-check -i ansible/ansible.cfg ansible/playbook.yml
