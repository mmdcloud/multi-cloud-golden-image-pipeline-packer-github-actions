name: "Scheduled Security Patch & Golden Image Rebake"

on:
  schedule:
    # Runs every Sunday at 02:00 UTC to re-bake base OS with latest CVE patches
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  trigger-build:
    name: "Trigger Automated Weekly Patching"
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Golden Image Build Pipeline
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'packer-build.yml',
              ref: 'main',
              inputs: {
                target_cloud: 'all',
                environment: 'prod',
                image_version: 'auto-patch'
              }
            });
