---
# ==============================================================================
# Base Role Tasks: System Updates, Base Packages, Timezone & Unattended Upgrades
# ==============================================================================

- name: Set system timezone to UTC
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Update apt cache and upgrade all packages to latest security releases
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install baseline enterprise packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    install_recommends: false

- name: Purge insecure legacy network services (CIS 2.1)
  ansible.builtin.apt:
    name: "{{ legacy_packages_to_remove }}"
    state: absent
    purge: true

- name: Configure automatic unattended security upgrades (CIS 1.2)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Package-Blacklist {
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::InstallOnShutdown "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

- name: Configure time synchronization with Chrony
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
