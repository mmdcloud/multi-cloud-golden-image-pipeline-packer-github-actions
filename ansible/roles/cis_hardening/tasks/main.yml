- name: Apply SSH Server Daemon Hardening (CIS Section 5.2)
  ansible.builtin.import_tasks: sshd.yml
  tags: ['cis', 'sshd']

- name: Configure System Audit Daemon & Inflexible Rules (CIS Section 4.1)
