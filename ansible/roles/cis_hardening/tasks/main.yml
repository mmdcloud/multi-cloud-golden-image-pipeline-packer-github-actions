  tags: ['cis', 'auditd']

- name: Apply Filesystem & Core Dump Protections (CIS Section 1)
  ansible.builtin.import_tasks: filesystem.yml
  tags: ['cis', 'filesystem']

- name: Apply PAM Authentication & Password Quality Policies (CIS Section 5.3)
  ansible.builtin.import_tasks: pam.yml
  tags: ['cis', 'pam']
